version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Disable routine version updates; security updates use a separate limit.
    open-pull-requests-limit: 0
    groups:
      docker-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Disable routine version updates; security updates use a separate limit.
    open-pull-requests-limit: 0
    groups:
      python-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Disable routine version updates; security updates use a separate limit.
    open-pull-requests-limit: 0
    groups:
      actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
