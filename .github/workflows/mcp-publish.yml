name: Publish to MCP Registry

on:
  workflow_call:
    inputs:
      tag:
        description: "Version tag to publish, for example v0.4.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to (re)publish, for example v0.4.0"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set version in server.json by registry type
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" --arg tag "$TAG" '
            if ([.packages[] | select(.registryType == "oci")] | length) != 1 then
              error("server.json must contain exactly one OCI package")
            elif ([.packages[] | select(.registryType == "pypi")] | length) != 1 then
              error("server.json must contain exactly one PyPI package")
            else
              .version = $v
              | (.packages[] | select(.registryType == "oci") | .identifier) =
                  ("docker.io/marcellm01/tinysearch:" + $tag)
              | (.packages[] | select(.registryType == "pypi") | .version) = $v
            end
          ' server.json > server.tmp
          mv server.tmp server.json
          python scripts/check_release_metadata.py --expected-version "$VERSION"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
