name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_live_search_tests:
        description: "Run opt-in tests against the live DDGS search backend"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  core-boundary:
    name: Core package boundary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the base package
        run: uv pip install --system .

      - name: Verify core imports without declared server dependencies
        run: |
          python -c "import tinysearch; from tinysearch import TinySearchConfig, to_prompt"
          python -c "import importlib.metadata as m; r=m.requires('tinysuite-search') or []; assert not any(x.lower().startswith(('fastapi','uvicorn','mcp')) and 'extra ==' not in x.lower() for x in r)"
          python -c "import importlib.metadata as m; r=m.requires('tinysuite-search') or []; assert any(x.lower().startswith('opentelemetry-api') for x in r); assert not any(x.lower().startswith(('opentelemetry-sdk','opentelemetry-exporter-otlp')) and 'extra ==' not in x.lower() for x in r)"

      - name: Run core contract tests
        run: python -m unittest tests.test_core tests.test_public_config_and_results tests.test_scrape_pipeline tests.test_grounded_prompt_service

  platform-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux; macOS and Windows only on the newest
        # Python, where missing platform wheels are most likely to show up.
        os:
          - ubuntu-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install package with server and telemetry extras
        run: uv pip install --system ".[server,telemetry]"

      - name: Run full test suite
        run: python -m unittest discover tests

      - name: Smoke-test MCP over stdio
        run: python scripts/smoke_mcp_stdio.py

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check release metadata
        run: python scripts/check_release_metadata.py

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel with server and telemetry extras into a fresh environment
        run: |
          python -m venv "${RUNNER_TEMP}/tinysearch-wheel"
          WHEEL="$(find "${GITHUB_WORKSPACE}/dist" -name '*.whl' -print -quit)"
          "${RUNNER_TEMP}/tinysearch-wheel/bin/python" -m pip install "${WHEEL}[server,telemetry]"

      - name: Verify installed wheel away from the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/tinysearch-wheel/bin/python" -c "import importlib.metadata as m, json, os, tinysearch, tomllib; expected=tomllib.load(open(os.path.join(os.environ['GITHUB_WORKSPACE'], 'pyproject.toml'), 'rb'))['project']['version']; assert m.version('tinysuite-search') == expected; json.dumps(tinysearch.TinySearchConfig().to_dict())"
          "${RUNNER_TEMP}/tinysearch-wheel/bin/python" "${GITHUB_WORKSPACE}/scripts/smoke_mcp_stdio.py"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  live-search-tests:
    name: Live DDGS search
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_search_tests }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the base package
        run: uv pip install --system .

      - name: Run live search tests
        env:
          TINYSEARCH_RUN_LIVE_TESTS: "1"
        run: python -m unittest tests.test_live_search

  docker-build:
    name: Docker security and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan container configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          scanners: misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          skip-dirs: .venv
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MCP image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: tinysearch:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image entrypoint
        run: docker run --rm tinysearch:test tinysearch --help

      - name: Scan image for vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_CONFIG_SCANNERS: secret
        with:
          image-ref: tinysearch:test
          scanners: vuln,secret
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
