name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-tests:
    name: Core package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify core imports without declared server dependencies
        run: |
          python -c "import tinysearch; from tinysearch import TinySearchConfig, to_prompt"
          python -c "import importlib.metadata as m; r=m.requires('tinysuite-tinysearch') or []; assert not any(x.lower().startswith(('fastapi','uvicorn','mcp')) and 'extra ==' not in x.lower() for x in r)"

      - name: Run core contract tests
        run: |
          python -m unittest \
            tests.test_core \
            tests.test_public_config_and_results \
            tests.test_agentic_research_pipeline \
            tests.test_scrape_service \
            tests.test_grounded_prompt_service

  server-tests:
    name: Server extra
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with server extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[server]"

      - name: Run full test suite
        run: python -m unittest discover tests

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tinysearch:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
