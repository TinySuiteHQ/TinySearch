[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysuite-search"
version = "0.4.1"
description = "Local web retrieval with ranked, source-grounded evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MarcellM01" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "crawl4ai==0.9.2",
    "tiktoken==0.12.0",
    "rank-bm25==0.2.2",
    "pypdf==6.14.2",
    "python-docx==1.2.0",
    "huggingface_hub==0.36.0",
    "onnxruntime>=1.17.0,<2",
    "tokenizers>=0.15.0,<1",
    "openai==2.36.0",
    "ddgs>=9.14.4,<10",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
server = [
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "mcp==1.28.1",
]

[project.urls]
Homepage = "https://github.com/TinySuiteHQ/TinySearch"
Repository = "https://github.com/TinySuiteHQ/TinySearch"

[project.scripts]
tinysearch = "tinysearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
