[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysuite-tinysearch"
version = "0.4.0"
description = "Local web retrieval with ranked, source-grounded evidence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "MarcellM01" }]

dependencies = [
    "crawl4ai==0.9.0",
    "tiktoken==0.12.0",
    "rank-bm25==0.2.2",
    "pypdf==6.13.3",
    "python-docx==1.2.0",
    "huggingface_hub==0.36.0",
    "onnxruntime>=1.17.0,<2",
    "tokenizers>=0.15.0,<1",
    "openai==2.36.0",
    "ddgs>=9.14.4,<10",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
server = [
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "mcp==1.27.1",
]

[project.urls]
Homepage = "https://github.com/MarcellM01/TinySearch"
Repository = "https://github.com/MarcellM01/TinySearch"

[project.scripts]
tinysearch = "tinysearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
