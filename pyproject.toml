[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysuite-search"
version = "0.6.4"
description = "Local web retrieval with ranked, source-grounded evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "MarcellM01" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "crawl4ai==0.9.2",
    # Crawl4AI only requires playwright>=1.49, which is too old for the browser
    # tools: accessibility snapshots with element refs need aria_snapshot's
    # mode/depth parameters, added in 1.59. That API has changed shape before
    # (it was `ref: bool` in 1.52 and absent in 1.54-1.58), so the floor is
    # explicit here and checked at runtime by browser_tool_service.
    "playwright>=1.59,<2",
    "tiktoken==0.12.0",
    "rank-bm25==0.2.2",
    "pypdf==6.16.1",
    "python-docx==1.2.0",
    "huggingface_hub==1.25.1",
    "onnxruntime>=1.17.0,<2",
    "tokenizers>=0.15.0,<1",
    "openai==2.48.0",
    "ddgs>=9.14.4,<10",
    "platformdirs>=4,<5",
    "opentelemetry-api>=1.44,<1.45",
]

[project.optional-dependencies]
server = [
    "fastapi==0.140.7",
    "uvicorn==0.46.0",
    "mcp==1.28.1",
]
telemetry = [
    "opentelemetry-sdk>=1.44,<1.45",
    "opentelemetry-exporter-otlp>=1.44,<1.45",
]

[project.urls]
Homepage = "https://github.com/TinySuiteHQ/TinySearch"
Repository = "https://github.com/TinySuiteHQ/TinySearch"

[project.scripts]
tinysearch = "tinysearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
